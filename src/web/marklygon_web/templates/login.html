{% extends "base.html" %}

{% block title %}Login - Trading Portfolio App{% endblock %}

{% block content %}
<div class="form-container">
    <h2 style="text-align: center; margin-bottom: 2rem; color: #333;">Login to Your Account</h2>
    
    <form method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
            <input name="password" type="password" placeholder="Password" required>
        </div>
        
        <div class="form-group">
            <button type="submit" class="btn" style="width: 100%; margin: 0;">Login</button>
        </div>
    </form>
    
    <p style="text-align: center; margin-top: 2rem; color: #666;">
        Don't have an account? <a href="{{ url_for('signup') }}" style="color: #667eea; text-decoration: none;">Sign up here</a>
    </p>
</div>
{% endblock %}
