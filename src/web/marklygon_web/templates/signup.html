{% extends "base.html" %}

{% block title %}Sign Up - Trading Portfolio App{% endblock %}

{% block content %}
<div class="form-container">
    <h2 style="text-align: center; margin-bottom: 2rem; color: #333;">Create Your Account</h2>
    
    <form method="POST">
        <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" required>
        </div>
        
        <div class="form-group">
            <label for="first_name">First Name</label>
            <input type="text" id="first_name" name="first_name" required>
        </div>
        
        <div class="form-group">
            <label for="last_name">Last Name</label>
            <input type="text" id="last_name" name="last_name" required>
        </div>
        
        <div class="form-group">
            <label for="password">Password</label>
            <input type="text" id="password" name="password" required>
        </div>

        <div class="form-group">
            <button type="submit" class="btn" style="width: 100%; margin: 0;">Create Account</button>
        </div>
    </form>
    
    <p style="text-align: center; margin-top: 2rem; color: #666;">
        Already have an account? <a href="{{ url_for('login') }}" style="color: #667eea; text-decoration: none;">Login here</a>
    </p>
</div>
{% endblock %}
