{% extends "base.html" %}

{% block title %}회원가입 - MarklygonAI{% endblock %}

{% block content %}
<div class="auth-page min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative z-10">
    <div class="max-w-md w-full space-y-8">
        <div class="obsidian-card rounded-lg shadow-2xl p-8 border border-gray-800">
            <div class="text-center">
                <div class="w-20 h-20 obsidian-card rounded-full mx-auto mb-6 flex items-center justify-center border border-gray-700">
                    <svg class="w-10 h-10 text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                    </svg>
                </div>
                <h2 class="text-3xl font-bold obsidian-text mb-2">회원가입</h2>
                <p class="text-gray-300 mb-8">MarklygonAI에 가입하여 AI 트레이딩을 시작하세요</p>
            </div>

            <form method="POST" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-300 mb-2">사용자명</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                        <input type="text" id="username" name="username" required 
                               class="obsidian-input w-full pl-10 pr-3 py-3 rounded-lg"
                               placeholder="사용자명을 입력하세요">
                    </div>
                </div>

                <div>
                    <label for="email" class="block text-sm font-medium text-gray-300 mb-2">이메일</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 12a4 4 0 10-8 0 4 4 0 008 0zm0 0v1.5a2.5 2.5 0 005 0V12a9 9 0 10-9 9m4.5-1.206a8.959 8.959 0 01-4.5 1.207"></path>
                            </svg>
                        </div>
                        <input type="email" id="email" name="email" required 
                               class="obsidian-input w-full pl-10 pr-3 py-3 rounded-lg"
                               placeholder="이메일을 입력하세요">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-2">비밀번호</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                            </svg>
                        </div>
                        <input type="password" id="password" name="password" required 
                               class="obsidian-input w-full pl-10 pr-3 py-3 rounded-lg"
                               placeholder="비밀번호를 입력하세요">
                    </div>
                </div>

                <div>
                    <label for="confirm_password" class="block text-sm font-medium text-gray-300 mb-2">비밀번호 확인</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                            </svg>
                        </div>
                        <input type="password" id="confirm_password" name="confirm_password" required 
                               class="obsidian-input w-full pl-10 pr-3 py-3 rounded-lg"
                               placeholder="비밀번호를 다시 입력하세요">
                    </div>
                </div>

                <div class="flex items-center">
                    <input type="checkbox" id="terms" name="terms" required class="h-4 w-4 text-green-400 focus:ring-green-500 border-gray-600 rounded bg-gray-800">
                    <label for="terms" class="ml-2 block text-sm text-gray-300">
                        <a href="#" class="text-green-400 hover:text-green-300 transition-colors">이용약관</a> 및 
                        <a href="#" class="text-green-400 hover:text-green-300 transition-colors">개인정보처리방침</a>에 동의합니다
                    </label>
                </div>

                <button type="submit" class="w-full obsidian-button py-3 px-4 rounded-lg font-medium card-hover">
                    <div class="flex items-center justify-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 9v3m0 0v3m0-3h3m-3 0h-3m-2-5a4 4 0 11-8 0 4 4 0 018 0zM3 20a6 6 0 0112 0v1H3v-1z"></path>
                        </svg>
                        회원가입
                    </div>
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-300">
                    이미 계정이 있으신가요? 
                    <a href="{{ url_for('login') }}" class="text-green-400 hover:text-green-300 font-medium transition-colors">로그인</a>
                </p>
            </div>

            <!-- Features Info -->
            <div class="mt-6 p-4 obsidian-card rounded-lg border border-gray-700">
                <div class="flex items-center mb-2">
                    <svg class="w-5 h-5 text-yellow-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                    <h4 class="text-sm font-medium text-gray-200">가입 혜택</h4>
                </div>
                <ul class="text-xs text-gray-300 space-y-1">
                    <li class="flex items-center">
                        <svg class="w-3 h-3 text-green-400 mr-2" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                        </svg>
                        6개 AI 모델 무료 이용
                    </li>
                    <li class="flex items-center">
                        <svg class="w-3 h-3 text-green-400 mr-2" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                        </svg>
                        실시간 포트폴리오 관리
                    </li>
                    <li class="flex items-center">
                        <svg class="w-3 h-3 text-green-400 mr-2" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                        </svg>
                        백테스트 및 성과 분석
                    </li>
                </ul>
            </div>
        </div>
    </div>
</div>
{% endblock %}
