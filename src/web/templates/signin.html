{% extends "base.html" %}

{% block title %}로그인 - MarklygonAI{% endblock %}

{% block content %}
<div class="auth-page min-h-screen flex items-center justify-center py-12 px-4 sm:px-6 lg:px-8 relative z-10">
    <div class="max-w-md w-full space-y-8">
        <div class="obsidian-card rounded-lg shadow-2xl p-8 border border-gray-800">
            <div class="text-center">
                <div class="w-20 h-20 obsidian-card rounded-full mx-auto mb-6 flex items-center justify-center border border-gray-700">
                    <svg class="w-10 h-10 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
                <h2 class="text-3xl font-bold obsidian-text mb-2">로그인</h2>
                <p class="text-gray-300 mb-8">MarklygonAI 계정에 로그인하세요</p>
            </div>

            <form method="POST" class="space-y-6">
                <div>
                    <label for="username" class="block text-sm font-medium text-gray-300 mb-2">사용자명</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"></path>
                            </svg>
                        </div>
                        <input type="text" id="username" name="username" required 
                               class="obsidian-input w-full pl-10 pr-3 py-3 rounded-lg"
                               placeholder="사용자명을 입력하세요">
                    </div>
                </div>

                <div>
                    <label for="password" class="block text-sm font-medium text-gray-300 mb-2">비밀번호</label>
                    <div class="relative">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                            </svg>
                        </div>
                        <input type="password" id="password" name="password" required 
                               class="obsidian-input w-full pl-10 pr-3 py-3 rounded-lg"
                               placeholder="비밀번호를 입력하세요">
                    </div>
                </div>

                <div class="flex items-center justify-between">
                    <div class="flex items-center">
                        <input type="checkbox" id="remember" name="remember" class="h-4 w-4 text-purple-400 focus:ring-purple-500 border-gray-600 rounded bg-gray-800">
                        <label for="remember" class="ml-2 block text-sm text-gray-300">로그인 상태 유지</label>
                    </div>
                    <a href="#" class="text-sm text-purple-400 hover:text-purple-300 transition-colors">비밀번호 찾기</a>
                </div>

                <button type="submit" class="w-full obsidian-button py-3 px-4 rounded-lg font-medium card-hover">
                    <div class="flex items-center justify-center">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1"></path>
                        </svg>
                        로그인
                    </div>
                </button>
            </form>

            <div class="mt-6 text-center">
                <p class="text-sm text-gray-300">
                    계정이 없으신가요? 
                    <a href="{{ url_for('register') }}" class="text-purple-400 hover:text-purple-300 font-medium transition-colors">회원가입</a>
                </p>
            </div>

            <!-- Demo Account Info -->
            <div class="mt-6 p-4 obsidian-card rounded-lg border border-gray-700">
                <div class="flex items-center mb-2">
                    <svg class="w-5 h-5 text-blue-400 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <h4 class="text-sm font-medium text-gray-200">데모 계정</h4>
                </div>
                <p class="text-xs text-gray-400 mb-2">테스트용 계정을 사용하거나 새 계정을 만드세요</p>
                <div class="text-xs text-gray-300">
                    <p>• 사용자명: demo</p>
                    <p>• 비밀번호: demo123</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
