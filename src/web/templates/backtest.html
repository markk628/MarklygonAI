{% extends "base.html" %}

{% block title %}백테스트 결과 - MarklygonAI{% endblock %}

{% block content %}
<div class="min-h-screen p-6 space-y-8 relative z-10">
    <!-- Header -->
    <div class="obsidian-card rounded-lg p-6 border border-gray-800">
        <div class="flex items-center justify-between">
            <div>
                <h1 class="text-3xl font-bold obsidian-text mb-2">백테스트 결과</h1>
                <p class="text-gray-300">AI 모델의 다양한 자산에 대한 성과 분석</p>
            </div>
            <div class="w-20 h-20 obsidian-card rounded-full flex items-center justify-center border border-gray-700">
                <svg class="icon-2xl text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                </svg>
            </div>
        </div>
    </div>

    <!-- Summary Cards -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
        <div class="obsidian-card card-hover rounded-lg p-6 border border-gray-800">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-400">총 결과</p>
                    <p class="text-2xl font-bold obsidian-text" id="total-results">-</p>
                </div>
                <div class="w-12 h-12 obsidian-card rounded-full flex items-center justify-center border border-gray-700">
                    <svg class="icon-lg text-gray-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                    </svg>
                </div>
            </div>
        </div>

        <div class="obsidian-card card-hover rounded-lg p-6 border border-gray-800">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-400">평균 수익률</p>
                    <p class="text-2xl font-bold" id="avg-return">-</p>
                </div>
                <div class="w-12 h-12 obsidian-card rounded-full flex items-center justify-center border border-gray-700">
                    <svg class="icon-lg text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6"></path>
                    </svg>
                </div>
            </div>
        </div>

        <div class="obsidian-card card-hover rounded-lg p-6 border border-gray-800">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-400">평균 샤프 비율</p>
                    <p class="text-2xl font-bold text-blue-400" id="avg-sharpe">-</p>
                </div>
                <div class="w-12 h-12 obsidian-card rounded-full flex items-center justify-center border border-gray-700">
                    <svg class="icon-lg text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path>
                    </svg>
                </div>
            </div>
        </div>

        <div class="obsidian-card card-hover rounded-lg p-6 border border-gray-800">
            <div class="flex items-center justify-between">
                <div>
                    <p class="text-sm font-medium text-gray-400">평균 최대 낙폭</p>
                    <p class="text-2xl font-bold text-red-400" id="avg-drawdown">-</p>
                </div>
                <div class="w-12 h-12 obsidian-card rounded-full flex items-center justify-center border border-gray-700">
                    <svg class="icon-lg text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 13l-5 5m0 0l-5-5m5 5V6"></path>
                    </svg>
                </div>
            </div>
        </div>
    </div>

    <!-- Performance Chart -->
    <div class="obsidian-card rounded-lg p-6 border border-gray-800">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold obsidian-text">모델별 성과 비교</h2>
            <svg class="icon-lg text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
            </svg>
        </div>
        <canvas id="performanceChart" width="400" height="200"></canvas>
    </div>

    <!-- Detailed Results Table -->
    <div class="obsidian-card rounded-lg p-6 border border-gray-800">
        <div class="flex items-center justify-between mb-6">
            <h2 class="text-2xl font-bold obsidian-text">상세 백테스트 결과</h2>
            <div class="flex items-center space-x-4">
                <select class="obsidian-input px-3 py-2 rounded-lg text-sm" id="model-filter">
                    <option value="">모든 모델</option>
                </select>
                <select class="obsidian-input px-3 py-2 rounded-lg text-sm" id="ticker-filter">
                    <option value="">모든 자산</option>
                </select>
            </div>
        </div>
        
        <div class="obsidian-table rounded-lg overflow-hidden">
            <table class="w-full">
                <thead>
                    <tr>
                        <th class="px-4 py-3 text-left">모델</th>
                        <th class="px-4 py-3 text-left">자산</th>
                        <th class="px-4 py-3 text-right">수익률</th>
                        <th class="px-4 py-3 text-right">샤프 비율</th>
                        <th class="px-4 py-3 text-right">최대 낙폭</th>
                        <th class="px-4 py-3 text-right">승률</th>
                        <th class="px-4 py-3 text-right">거래 수</th>
                        <th class="px-4 py-3 text-center">날짜</th>
                    </tr>
                </thead>
                <tbody id="backtest-results">
                    <!-- Results will be dynamically added here -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Risk Metrics -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-6">
        <div class="obsidian-card rounded-lg p-6 border border-gray-800">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold obsidian-text">리스크 지표</h2>
                <svg class="icon-lg text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"></path>
                </svg>
            </div>
            <canvas id="riskChart" width="400" height="200"></canvas>
        </div>

        <div class="obsidian-card rounded-lg p-6 border border-gray-800">
            <div class="flex items-center justify-between mb-6">
                <h2 class="text-2xl font-bold obsidian-text">수익률 분포</h2>
                <svg class="icon-lg text-green-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 8v8m-4-5v5m-4-2v2m-2 4h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"></path>
                </svg>
            </div>
            <canvas id="distributionChart" width="400" height="200"></canvas>
        </div>
    </div>
</div>

<script>
let allBacktestResults = [];
let performanceChart = null;
let riskChart = null;
let distributionChart = null;

// Load data when page loads
document.addEventListener('DOMContentLoaded', function() {
    loadBacktestData();
    
    // Add event listeners for filters
    document.getElementById('model-filter').addEventListener('change', filterResults);
    document.getElementById('ticker-filter').addEventListener('change', filterResults);
});

async function loadBacktestData() {
    try {
        const response = await fetch('/api/backtest-results');
        const data = await response.json();
        allBacktestResults = data.backtest_results;
        
        // Update summary cards
        updateSummaryCards(allBacktestResults);
        
        // Populate filter options
        populateFilters(allBacktestResults);
        
        // Display results
        displayResults(allBacktestResults);
        
        // Update charts
        updatePerformanceChart(allBacktestResults);
        updateRiskChart(allBacktestResults);
        updateDistributionChart(allBacktestResults);
        
    } catch (error) {
        console.error('Error loading backtest data:', error);
    }
}

function updateSummaryCards(results) {
    // Total results
    document.getElementById('total-results').textContent = results.length;
    
    // Average return
    const avgReturn = results.reduce((sum, r) => sum + r.return_rate, 0) / results.length;
    const avgReturnElement = document.getElementById('avg-return');
    avgReturnElement.textContent = `${avgReturn >= 0 ? '+' : ''}${avgReturn.toFixed(2)}%`;
    avgReturnElement.className = `text-2xl font-bold ${avgReturn >= 0 ? 'text-green-400' : 'text-red-400'}`;
    
    // Average Sharpe ratio
    const avgSharpe = results.reduce((sum, r) => sum + r.sharpe_ratio, 0) / results.length;
    document.getElementById('avg-sharpe').textContent = avgSharpe.toFixed(2);
    
    // Average max drawdown
    const avgDrawdown = results.reduce((sum, r) => sum + r.max_drawdown, 0) / results.length;
    document.getElementById('avg-drawdown').textContent = `${avgDrawdown.toFixed(2)}%`;
}

function populateFilters(results) {
    // Get unique models and tickers
    const models = [...new Set(results.map(r => r.model_type))];
    const tickers = [...new Set(results.map(r => r.ticker))];
    
    // Populate model filter
    const modelFilter = document.getElementById('model-filter');
    models.forEach(model => {
        const option = document.createElement('option');
        option.value = model;
        option.textContent = model;
        modelFilter.appendChild(option);
    });
    
    // Populate ticker filter
    const tickerFilter = document.getElementById('ticker-filter');
    tickers.forEach(ticker => {
        const option = document.createElement('option');
        option.value = ticker;
        option.textContent = ticker;
        tickerFilter.appendChild(option);
    });
}

function filterResults() {
    const modelFilter = document.getElementById('model-filter').value;
    const tickerFilter = document.getElementById('ticker-filter').value;
    
    let filteredResults = allBacktestResults;
    
    if (modelFilter) {
        filteredResults = filteredResults.filter(r => r.model_type === modelFilter);
    }
    
    if (tickerFilter) {
        filteredResults = filteredResults.filter(r => r.ticker === tickerFilter);
    }
    
    displayResults(filteredResults);
    updateSummaryCards(filteredResults);
    updatePerformanceChart(filteredResults);
    updateRiskChart(filteredResults);
    updateDistributionChart(filteredResults);
}

function displayResults(results) {
    const tbody = document.getElementById('backtest-results');
    tbody.innerHTML = '';
    
    results.forEach(result => {
        const row = document.createElement('tr');
        
        // Determine performance status
        let statusClass = 'bg-yellow-900 text-yellow-300';
        let statusText = '보통';
        if (result.return_rate > 20) {
            statusClass = 'bg-purple-900 text-purple-300';
            statusText = '최우수';
        } else if (result.return_rate > 10) {
            statusClass = 'bg-green-900 text-green-300';
            statusText = '우수';
        } else if (result.return_rate < 0) {
            statusClass = 'bg-red-900 text-red-300';
            statusText = '부진';
        }
        
        // Format date
        const backtestDate = new Date(result.backtest_date);
        const formattedDate = backtestDate.toLocaleDateString('ko-KR');
        
        row.innerHTML = `
            <td class="px-4 py-3">
                <div class="flex items-center">
                    <div class="w-8 h-8 obsidian-card rounded-full flex items-center justify-center mr-3">
                        <span class="text-xs font-bold text-purple-400">${result.model_type[0]}</span>
                    </div>
                    <span class="font-medium">${result.model_name}</span>
                </div>
            </td>
            <td class="px-4 py-3">${result.ticker}</td>
            <td class="px-4 py-3 text-right ${result.return_rate >= 0 ? 'text-green-400' : 'text-red-400'} font-bold">
                ${result.return_rate >= 0 ? '+' : ''}${result.return_rate.toFixed(2)}%
            </td>
            <td class="px-4 py-3 text-right">${result.sharpe_ratio.toFixed(2)}</td>
            <td class="px-4 py-3 text-right text-red-400">${result.max_drawdown.toFixed(2)}%</td>
            <td class="px-4 py-3 text-right">${result.win_rate.toFixed(1)}%</td>
            <td class="px-4 py-3 text-right">${result.total_trades}</td>
            <td class="px-4 py-3 text-center">
                <span class="text-sm text-gray-400">${formattedDate}</span>
            </td>
        `;
        tbody.appendChild(row);
    });
}

// Performance Comparison Chart
function updatePerformanceChart(results) {
    const ctx = document.getElementById('performanceChart').getContext('2d');
    
    // Group by model and calculate average returns
    const modelPerformance = {};
    results.forEach(result => {
        if (!modelPerformance[result.model_name]) {
            modelPerformance[result.model_name] = [];
        }
        modelPerformance[result.model_name].push(result.return_rate);
    });
    
    const labels = Object.keys(modelPerformance);
    const data = labels.map(model => {
        const returns = modelPerformance[model];
        return returns.reduce((sum, r) => sum + r, 0) / returns.length;
    });
    
    if (performanceChart) {
        performanceChart.destroy();
    }
    
    performanceChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: '평균 수익률 (%)',
                data: data,
                backgroundColor: data.map(value => value >= 0 ? 'rgba(16, 185, 129, 0.8)' : 'rgba(239, 68, 68, 0.8)'),
                borderColor: data.map(value => value >= 0 ? '#10b981' : '#ef4444'),
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    labels: {
                        color: '#e0e0e0'
                    }
                }
            },
            scales: {
                x: {
                    ticks: {
                        color: '#9ca3af'
                    },
                    grid: {
                        color: '#1f2937'
                    }
                },
                y: {
                    ticks: {
                        color: '#9ca3af',
                        callback: function(value) {
                            return value + '%';
                        }
                    },
                    grid: {
                        color: '#1f2937'
                    }
                }
            }
        }
    });
}

// Risk Chart
function updateRiskChart(results) {
    const ctx = document.getElementById('riskChart').getContext('2d');
    
    // Get top 2 performing models for comparison
    const modelGroups = {};
    results.forEach(result => {
        if (!modelGroups[result.model_type]) {
            modelGroups[result.model_type] = {
                returns: [],
                sharpes: [],
                drawdowns: [],
                winRates: []
            };
        }
        modelGroups[result.model_type].returns.push(result.return_rate);
        modelGroups[result.model_type].sharpes.push(result.sharpe_ratio);
        modelGroups[result.model_type].drawdowns.push(Math.abs(result.max_drawdown));
        modelGroups[result.model_type].winRates.push(result.win_rate);
    });
    
    // Calculate averages and create datasets
    const datasets = Object.entries(modelGroups).slice(0, 2).map(([model, data], index) => {
        const avgReturn = data.returns.reduce((a, b) => a + b, 0) / data.returns.length;
        const avgSharpe = data.sharpes.reduce((a, b) => a + b, 0) / data.sharpes.length;
        const avgDrawdown = data.drawdowns.reduce((a, b) => a + b, 0) / data.drawdowns.length;
        const avgWinRate = data.winRates.reduce((a, b) => a + b, 0) / data.winRates.length;
        
        // Normalize values to 0-100 scale
        const normalizedReturn = Math.min(100, Math.max(0, avgReturn * 2));
        const normalizedSharpe = Math.min(100, avgSharpe * 25);
        const normalizedDrawdown = Math.min(100, 100 - avgDrawdown * 2);
        const normalizedWinRate = avgWinRate;
        
        return {
            label: model,
            data: [normalizedReturn, normalizedSharpe, normalizedDrawdown, normalizedWinRate, 80, 85],
            borderColor: index === 0 ? '#8b5cf6' : '#06b6d4',
            backgroundColor: index === 0 ? 'rgba(139, 92, 246, 0.1)' : 'rgba(6, 182, 212, 0.1)',
            borderWidth: 2
        };
    });
    
    if (riskChart) {
        riskChart.destroy();
    }
    
    riskChart = new Chart(ctx, {
        type: 'radar',
        data: {
            labels: ['수익률', '샤프비율', '안정성', '승률', '일관성', '효율성'],
            datasets: datasets
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    labels: {
                        color: '#e0e0e0'
                    }
                }
            },
            scales: {
                r: {
                    ticks: {
                        color: '#9ca3af'
                    },
                    grid: {
                        color: '#1f2937'
                    },
                    angleLines: {
                        color: '#1f2937'
                    }
                }
            }
        }
    });
}

// Distribution Chart
function updateDistributionChart(results) {
    const ctx = document.getElementById('distributionChart').getContext('2d');
    
    // Create bins for return distribution
    const bins = [-30, -20, -10, 0, 10, 20, 30, 40, 50];
    const counts = new Array(bins.length - 1).fill(0);
    
    results.forEach(result => {
        const returnRate = result.return_rate;
        for (let i = 0; i < bins.length - 1; i++) {
            if (returnRate >= bins[i] && returnRate < bins[i + 1]) {
                counts[i]++;
                break;
            }
        }
    });
    
    const labels = bins.slice(0, -1).map((bin, i) => `${bin}% ~ ${bins[i + 1]}%`);
    
    if (distributionChart) {
        distributionChart.destroy();
    }
    
    distributionChart = new Chart(ctx, {
        type: 'bar',
        data: {
            labels: labels,
            datasets: [{
                label: '백테스트 결과 수',
                data: counts,
                backgroundColor: 'rgba(16, 185, 129, 0.8)',
                borderColor: '#10b981',
                borderWidth: 2
            }]
        },
        options: {
            responsive: true,
            plugins: {
                legend: {
                    labels: {
                        color: '#e0e0e0'
                    }
                }
            },
            scales: {
                x: {
                    ticks: {
                        color: '#9ca3af',
                        maxRotation: 45,
                        minRotation: 45
                    },
                    grid: {
                        color: '#1f2937'
                    }
                },
                y: {
                    ticks: {
                        color: '#9ca3af'
                    },
                    grid: {
                        color: '#1f2937'
                    }
                }
            }
        }
    });
}
</script>
{% endblock %}
